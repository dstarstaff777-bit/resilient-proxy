server:
  port: 8080

downstream:
  url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers,circuitbreakerevents,ratelimiters,bulkheads
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      orders:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 1s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      notifications:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 70
        slowCallRateThreshold: 70
        slowCallDurationThreshold: 1s
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      orders:
        maxAttempts: 3
        waitDuration: 200ms
        retryExceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
      notifications:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException

  bulkhead:
    instances:
      orders:
        maxConcurrentCalls: 5
        maxWaitDuration: 0
      notifications:
        maxConcurrentCalls: 10
        maxWaitDuration: 0
    ratelimiter:
      instances:
        orders:
          limitForPeriod: 10
          limitRefreshPeriod: 1s
          timeoutDuration: 0
        notifications:
          limitForPeriod: 20
          limitRefreshPeriod: 1s
          timeoutDuration: 0

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-no-id}] %logger{36} - %msg%n"
  level:
    io.github.resilience4j: DEBUG